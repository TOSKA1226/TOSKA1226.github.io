<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OG share card · 1200x630</title>
<!--
  分享卡源文件。渲染方式：
    chrome --headless --screenshot --window-size=1200,630 --hide-scrollbars \
           --force-device-scale-factor=1 assets/og-card.html
  产物即 assets/og.png（1200x630），站内 og:image / twitter:image 指向它。
  纯内联样式与内联 SVG，零外部请求。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",system-ui,sans-serif;
    background:#f5f7fb;color:#1c2230;-webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative;width:1200px;height:630px;overflow:hidden;
    background:linear-gradient(180deg,#eef4fc 0%,#f5f7fb 52%,#f7f9fd 100%);
  }
  .hills{position:absolute;left:0;right:0;bottom:0;width:1200px;height:300px}
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(#e3e8f1 1px,transparent 1px),linear-gradient(90deg,#e3e8f1 1px,transparent 1px);
    background-size:60px 60px;opacity:.42;
    mask-image:radial-gradient(120% 90% at 20% 0%,#000 0%,transparent 78%);
    -webkit-mask-image:radial-gradient(120% 90% at 20% 0%,#000 0%,transparent 78%);
  }
  .inner{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column}

  .brand{display:flex;align-items:center;gap:16px}
  .mark{
    width:56px;height:56px;border-radius:16px;background:#2563eb;color:#fff;
    display:grid;place-items:center;font-size:30px;font-weight:700;
    box-shadow:0 10px 24px rgba(37,99,235,.28);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.3}
  .brand-name{font-size:21px;font-weight:700;letter-spacing:.01em}
  .brand-handle{font-size:14px;color:#8c94a4;font-weight:400}

  .eyebrow{
    margin-top:46px;
    display:inline-flex;align-items:center;gap:9px;align-self:flex-start;
    height:32px;padding:0 14px;border-radius:999px;
    background:#ffffff;border:1px solid #e3e8f1;
    font-size:13px;color:#5b6476;
  }
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:#2563eb;display:block}

  h1{
    margin-top:20px;max-width:760px;
    font-size:58px;line-height:1.26;font-weight:700;letter-spacing:-.01em;
  }
  h1 .hl{color:#2563eb}
  .sub{
    margin-top:20px;max-width:640px;
    font-size:20px;line-height:1.7;color:#4a5366;font-weight:400;
  }
  .tags{margin-top:28px;display:flex;gap:10px}
  .tag{
    height:34px;display:inline-flex;align-items:center;padding:0 14px;
    border-radius:8px;background:#ffffff;border:1px solid #e3e8f1;
    font-size:13.5px;color:#5b6476;
  }
  .tag.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:500}

  .url{
    margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    font-size:15px;color:#8c94a4;letter-spacing:.02em;
  }
  .url b{color:#1c2230;font-weight:600;font-size:16px}
  .url .right{display:flex;align-items:center;gap:8px}
  .pulse{width:7px;height:7px;border-radius:50%;background:#1c8a5c;box-shadow:0 0 0 4px rgba(28,138,92,.14);display:block}

  .win{
    position:absolute;right:76px;top:150px;width:352px;
    background:#fff;border:1px solid #e9eef7;border-radius:16px;
    box-shadow:0 30px 60px rgba(31,41,55,.16);
    transform:rotate(-3deg);overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .win-bar{display:flex;align-items:center;gap:7px;padding:13px 15px;border-bottom:1px solid #eef1f7}
  .dot{width:10px;height:10px;border-radius:50%}
  .d1{background:#ff5f57}.d2{background:#ffbd2e}.d3{background:#28c840}
  .file{margin-left:auto;font-size:11px;letter-spacing:.08em;color:#9aa3b4;text-transform:uppercase}
  .win-body{padding:20px 18px 22px;display:flex;flex-direction:column;gap:12px}
  .line{height:9px;border-radius:5px;background:#e7ecf5}
  .l1{width:46%;background:#2563eb}
  .l2{width:80%;background:#dde5f2}
  .l3{width:62%;background:#dde5f2}
  .l4{width:90%;background:#dde5f2}
  .l5{width:40%;background:#dde5f2}
  .win-foot{
    margin-top:4px;padding:12px 18px;border-top:1px solid #eef1f7;
    display:flex;align-items:center;gap:7px;
    font-size:10.5px;letter-spacing:.14em;color:#8c94a4;text-transform:uppercase;
  }
  .win-pulse{width:6px;height:6px;border-radius:50%;background:#1c8a5c;box-shadow:0 0 0 3px rgba(28,138,92,.16);display:block}
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 168 Q140 118 300 144 T600 128 Q760 106 900 146 T1200 132 V300 H0 Z" fill="#dbe6f5" opacity=".9"></path>
    <path d="M0 212 Q180 168 360 190 T720 182 Q880 162 1040 194 T1200 186 V300 H0 Z" fill="#c6d8ee" opacity=".85"></path>
    <path d="M0 252 Q220 220 430 238 T820 232 Q980 220 1200 240 V300 H0 Z" fill="#b2c8e4" opacity=".8"></path>
  </svg>

  <div class="inner">
    <div class="brand">
      <span class="mark">述</span>
      <span class="brand-text">
        <span class="brand-name">蒋东邕</span>
        <span class="brand-handle">@TOSKA1226</span>
      </span>
    </div>

    <span class="eyebrow"><i></i>开放实习机会 · 2026 上半年可到岗</span>

    <h1>把重复劳动交给<span class="hl">脚本</span>，<br>把判断留给自己。</h1>

    <p class="sub">材料在读，写 Python，做 AI Agent 与插件。<br>站点放三样东西：我是谁、我在做什么、值得持续读的 22 个信息源。</p>

    <div class="tags">
      <span class="tag on">AI Agent</span>
      <span class="tag">Python 工具链</span>
      <span class="tag">长期记忆与检索</span>
      <span class="tag">22 Sources</span>
    </div>

    <div class="url">
      <span><b>toska1226.github.io</b></span>
      <span class="right"><span class="pulse"></span>开放 / Open to internship</span>
    </div>
  </div>

  <div class="win" aria-hidden="true">
    <div class="win-bar">
      <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      <span class="file">index.html</span>
    </div>
    <div class="win-body">
      <span class="line l1"></span>
      <span class="line l2"></span>
      <span class="line l3"></span>
      <span class="line l4"></span>
      <span class="line l5"></span>
    </div>
    <div class="win-foot"><span class="win-pulse"></span>SITE / 22 SOURCES</div>
  </div>
</div>
</body>
</html>
